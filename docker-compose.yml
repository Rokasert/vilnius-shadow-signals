services:
  pipeline:
    build: .
    image: shadow-signals:local
    command: ["shadow-signals", "run"]
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
      - ./output:/app/output

  app:
    build: .
    image: shadow-signals:local
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      pipeline:
        condition: service_completed_successfully
